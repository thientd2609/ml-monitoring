name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile Python sources
        run: python -m compileall -q api evidently scripts simulations dags
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config

  build:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image namespace
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/ml-monitoring-api:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/ml-monitoring-api:latest
      - name: Build and push Evidently image
        uses: docker/build-push-action@v6
        with:
          context: ./evidently
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/ml-monitoring-evidently:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/ml-monitoring-evidently:latest
