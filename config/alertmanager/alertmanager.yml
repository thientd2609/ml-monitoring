global:
  resolve_timeout: 5m

route:
  receiver: telegram
  group_by: ["alertname", "component", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /etc/alertmanager/telegram_bot_token
        chat_id: 0
        parse_mode: HTML
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🚨 <b>ML Monitoring Alert</b>{{ else }}✅ <b>Alert Resolved</b>{{ end }}
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b> ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
